# Application
spring.application.name=selfquiz-backend
server.port=8080

# Environment Variables Import
spring.config.import=optional:file:.env.properties

# SQL Server Database
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost};instanceName=${DB_INSTANCE:SQLEXPRESS};databaseName=${DB_NAME:SelfQuiz};integratedSecurity=${DB_AUTH_INTEGRATED:false};encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# File Upload Limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT Authentication
jwt.secret=9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d9
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# CORS
app.cors.allowed-origins=http://localhost:5173
